<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Sudoku with Chain Highlighting</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --border-color: #475569;
            --cell-bg: #0f172a;
            --cell-selected: #334155;
            --cell-highlight: #1e3a8a55;
            --given-color: #e2e8f0;
            --input-color: #60a5fa;
            
            /* Highlighting Colors */
            --color-yellow: #fef08a;
            --color-green: #bbf7d0;
            --color-blue: #bfdbfe;
            --color-pink: #fbcfe8;
            --color-purple: #e9d5ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px;
        }

        header {
            margin-bottom: 20px;
            text-align: center;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .controls-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }

        select, button {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        button:hover, select:hover {
            background-color: var(--border-color);
        }

        button.active {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            max-width: 450px;
            width: 100%;
        }

        .mode-indicators {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
            font-size: 0.82rem;
            color: #94a3b8;
            flex-wrap: wrap;
            justify-content: center;
        }

        .mode-indicators span {
            padding: 3px 10px;
            border-radius: 4px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
        }

        .board {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            width: 100%;
            aspect-ratio: 1;
            border: 3px solid var(--text-color);
            background-color: var(--text-color);
            gap: 1px;
            margin-bottom: 14px;
        }

        .cell {
            background-color: var(--cell-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            position: relative;
            transition: background-color 0.1s;
        }

        /* Scaled slightly smaller for a clean, non-crowded appearance */
        .cell .cell-val {
            font-size: 1.15rem;
            font-weight: 600;
            line-height: 1;
            z-index: 5;
        }

        .cell.given .cell-val {
            color: var(--given-color);
            font-weight: 700;
        }

        .cell.user-input .cell-val {
            color: var(--input-color);
            font-weight: 600;
        }

        .cell.selected {
            background-color: var(--cell-selected) !important;
        }

        .cell.highlighted {
            background-color: var(--cell-highlight);
        }

        .cell.error {
            color: #f87171 !important;
            background-color: rgba(239, 68, 68, 0.2) !important;
        }

        /* Thick borders for 3x3 subgrids */
        .cell:nth-child(3n) { border-right: 2px solid var(--text-color); }
        .cell:nth-child(9n) { border-right: none; }
        .cell:nth-last-child(-n+9):not(:nth-last-child(-n+18)) { border-bottom: 2px solid var(--text-color); }
        .cell:nth-child(n-19):nth-child(-n-27),
        .cell:nth-child(n-46):nth-child(-n-54) { border-bottom: 2px solid var(--text-color); }

        /* Snyder (Corner/Edge) Notes Grid (3x3) */
        .corner-notes-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            padding: 1px 2px;
            font-size: 0.5rem;
            line-height: 1;
            color: #94a3b8;
            pointer-events: none;
            z-index: 2;
        }

        .corner-note-cell {
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 500;
        }

        /* Middle (Center) Notes Cluster */
        .center-notes {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.58rem;
            font-weight: 600;
            line-height: 1;
            color: #38bdf8;
            pointer-events: none;
            letter-spacing: 0.5px;
            z-index: 3;
            max-width: 90%;
            text-align: center;
            word-break: break-all;
        }

        /* Keypad Container */
        .keypad-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* 5x2 Keypad Grid (1-5, 6-9, Erase) */
        .keypad {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            width: 100%;
        }

        .key-btn {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 4px;
            min-height: 50px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-color);
            transition: all 0.15s ease;
            user-select: none;
            box-sizing: border-box;
        }

        .key-btn .num {
            font-size: 1.25rem;
            font-weight: 600;
            line-height: 1.1;
        }

        .key-btn span.count {
            font-size: 0.65rem;
            color: #94a3b8;
            font-weight: 500;
            margin-top: 2px;
        }

        .key-btn:hover {
            background: var(--border-color);
            transform: translateY(-1px);
        }

        .key-btn:active {
            transform: translateY(0);
        }

        .key-btn.erase-btn {
            border-color: rgba(239, 68, 68, 0.4);
            color: #f87171;
        }

        .key-btn.erase-btn:hover {
            background: rgba(239, 68, 68, 0.15);
            border-color: #f87171;
        }

        .key-btn.erase-btn span.count {
            color: #fca5a5;
        }

        /* Notes Controls Panel Directly Under Numbers */
        .notes-controls-panel {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 10px;
            box-sizing: border-box;
        }

        .mode-toggle-group {
            display: flex;
            gap: 6px;
            width: 100%;
        }

        .mode-btn {
            flex: 1;
            padding: 7px 10px;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            border-radius: 6px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: #94a3b8;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .mode-btn:hover {
            color: var(--text-color);
            border-color: #64748b;
        }

        .mode-btn.active {
            background: var(--accent-color);
            border-color: var(--accent-color);
            color: #ffffff;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.4);
        }

        .note-type-toggle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding-top: 6px;
            border-top: 1px solid rgba(71, 85, 105, 0.4);
        }

        .note-type-toggle .sub-label {
            font-size: 0.75rem;
            color: #94a3b8;
            font-weight: 500;
        }

        .pill-group {
            display: flex;
            gap: 6px;
        }

        .pill-toggle-btn {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: #94a3b8;
            border-radius: 20px;
            padding: 4px 10px;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.15s ease;
        }

        .pill-toggle-btn .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #64748b;
        }

        .pill-toggle-btn:hover {
            color: var(--text-color);
            border-color: #64748b;
        }

        .pill-toggle-btn.active {
            background: #1e3a8a;
            border-color: #3b82f6;
            color: #ffffff;
            font-weight: 600;
        }

        .pill-toggle-btn.active .dot {
            background: #60a5fa;
            box-shadow: 0 0 6px #60a5fa;
        }

        /* Color Palette */
        .palette {
            display: flex;
            gap: 8px;
            justify-content: center;
            align-items: center;
            margin-top: 2px;
        }

        .color-btn {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 2px solid var(--border-color);
            cursor: pointer;
            transition: transform 0.1s;
        }

        .color-btn:hover {
            transform: scale(1.15);
        }

        .color-btn.yellow { background-color: var(--color-yellow); }
        .color-btn.green { background-color: var(--color-green); }
        .color-btn.blue { background-color: var(--color-blue); }
        .color-btn.pink { background-color: var(--color-pink); }
        .color-btn.purple { background-color: var(--color-purple); }
        .color-btn.clear { background-color: var(--card-bg); display: flex; align-items: center; justify-content: center; font-size: 0.7rem; }
    </style>
</head>
<body>

    <header>
        <h1>Sudoku Solver & Chain Analyzer</h1>
    </header>

    <div class="game-container">
        <div class="controls-bar">
            <select id="difficulty" onchange="newGame()">
                <option value="easy">Easy</option>
                <option value="medium" selected>Medium</option>
                <option value="hard">Hard</option>
                <option value="expert">Expert</option>
            </select>
            <button onclick="newGame()">New Game</button>
            <button onclick="toggleMode('color')" id="mode-color-btn">Highlight Color</button>
            <button onclick="restartGame()">Reset</button>
        </div>

        <div class="mode-indicators">
            <span>Input: <strong id="current-mode-label">Normal (Numbers)</strong></span>
            <span>Highlight: <strong id="current-color-label">None</strong></span>
        </div>

        <!-- 9x9 Sudoku Board -->
        <div class="board" id="sudoku-board"></div>

        <div class="keypad-container">
            <!-- 5x2 Keypad: 1-5 top row, 6-9 + Erase bottom row -->
            <div class="keypad" id="keypad"></div>

            <!-- Pencil Notes Option Directly Under Actual Numbers -->
            <div class="notes-controls-panel">
                <div class="mode-toggle-group">
                    <button id="btn-mode-number" class="mode-btn active" onclick="setInputMode('number')">
                        <span>🔢</span> Normal Numbers
                    </button>
                    <button id="btn-mode-note" class="mode-btn" onclick="setInputMode('note')">
                        <span>✏️</span> Pencil Notes
                    </button>
                </div>

                <div class="note-type-toggle">
                    <span class="sub-label">Notes Type:</span>
                    <div class="pill-group">
                        <button id="pill-snyder" class="pill-toggle-btn active" onclick="setNoteStyle('snyder')" title="Snyder notation (corner/edge marks)">
                            <span class="dot"></span> Snyder (Corner)
                        </button>
                        <button id="pill-middle" class="pill-toggle-btn" onclick="setNoteStyle('middle')" title="Center/middle candidate notes">
                            <span class="dot"></span> Middle (Center)
                        </button>
                    </div>
                </div>
            </div>

            <!-- Chain / Cell Highlighting Palette -->
            <div class="palette">
                <div class="color-btn yellow" onclick="selectColor('yellow')" title="Highlight Yellow"></div>
                <div class="color-btn green" onclick="selectColor('green')" title="Highlight Green"></div>
                <div class="color-btn blue" onclick="selectColor('blue')" title="Highlight Blue"></div>
                <div class="color-btn pink" onclick="selectColor('pink')" title="Highlight Pink"></div>
                <div class="color-btn purple" onclick="selectColor('purple')" title="Highlight Purple"></div>
                <div class="color-btn clear" onclick="selectColor(null)" title="Remove Color">✕</div>
            </div>
        </div>
    </div>

    <script>
        let board = Array(81).fill(0);
        let initialBoard = Array(81).fill(0);
        let solution = Array(81).fill(0);
        let given = Array(81).fill(false);
        let snyderNotes = Array(81).fill().map(() => new Set());
        let middleNotes = Array(81).fill().map(() => new Set());
        let colors = Array(81).fill(null);
        
        let selectedCell = null;
        let inputMode = 'number'; // 'number', 'note', 'color'
        let noteStyle = 'snyder'; // 'snyder', 'middle'
        let activeColor = 'yellow';

        const colorHexMap = {
            'yellow': 'var(--color-yellow)',
            'green': 'var(--color-green)',
            'blue': 'var(--color-blue)',
            'pink': 'var(--color-pink)',
            'purple': 'var(--color-purple)'
        };

        const puzzles = {
            easy: "530070000600195000098000060800060003400803001700020006060000280000419005000080079",
            medium: "000260701680070090190004500820100040004602900050003028009300074040050036703018000",
            hard: "000000000000003085001020000000507000004001020020000000000004027500000000000000000",
            expert: "000000000000030850010200000000507000004001020020000000000004027500000000000000000"
        };

        function initGame() {
            createBoardDOM();
            createKeypadDOM();
            newGame();
        }

        function createBoardDOM() {
            const boardEl = document.getElementById('sudoku-board');
            boardEl.innerHTML = '';
            for (let i = 0; i < 81; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.dataset.index = i;
                cell.addEventListener('click', () => selectCellIndex(i));
                
                // Corner / Snyder Notes Grid (3x3)
                const cornerGrid = document.createElement('div');
                cornerGrid.className = 'corner-notes-grid';
                for (let n = 1; n <= 9; n++) {
                    const noteCell = document.createElement('div');
                    noteCell.className = 'corner-note-cell';
                    noteCell.dataset.note = n;
                    cornerGrid.appendChild(noteCell);
                }
                cell.appendChild(cornerGrid);

                // Center / Middle Notes Cluster
                const centerNotes = document.createElement('div');
                centerNotes.className = 'center-notes';
                cell.appendChild(centerNotes);

                boardEl.appendChild(cell);
            }
        }

        function createKeypadDOM() {
            const keypadEl = document.getElementById('keypad');
            keypadEl.innerHTML = '';
            for (let i = 1; i <= 9; i++) {
                const btn = document.createElement('button');
                btn.className = 'key-btn';
                btn.innerHTML = `<span class="num">${i}</span><span class="count" id="count-${i}">9</span>`;
                btn.addEventListener('click', () => handleKeyInput(i));
                keypadEl.appendChild(btn);
            }
            // 10th button: Erase slot completing the 5x2 grid
            const eraseBtn = document.createElement('button');
            eraseBtn.className = 'key-btn erase-btn';
            eraseBtn.innerHTML = `<span class="num">⌫</span><span class="count">Erase</span>`;
            eraseBtn.title = "Erase number / notes (Backspace)";
            eraseBtn.addEventListener('click', clearSelection);
            keypadEl.appendChild(eraseBtn);
        }

        function newGame() {
            const diff = document.getElementById('difficulty').value;
            let sample = puzzles[diff] || puzzles.medium;
            
            board = sample.split('').map(Number);
            initialBoard = [...board];
            given = board.map(val => val !== 0);
            solution = [...board];
            snyderNotes = Array(81).fill().map(() => new Set());
            middleNotes = Array(81).fill().map(() => new Set());
            colors = Array(81).fill(null);
            selectedCell = null;
            
            updateBoardDOM();
            updateKeypadCounts();
        }

        function restartGame() {
            board = [...initialBoard];
            snyderNotes = Array(81).fill().map(() => new Set());
            middleNotes = Array(81).fill().map(() => new Set());
            colors = Array(81).fill(null);
            selectedCell = null;
            updateBoardDOM();
            updateKeypadCounts();
        }

        function selectCellIndex(index) {
            selectedCell = index;
            updateBoardDOM();
        }

        function setInputMode(mode) {
            inputMode = mode;
            document.getElementById('btn-mode-number').classList.toggle('active', mode === 'number');
            document.getElementById('btn-mode-note').classList.toggle('active', mode === 'note');
            document.getElementById('mode-color-btn').classList.remove('active');
            updateIndicatorLabel();
        }

        function setNoteStyle(style) {
            noteStyle = style;
            setInputMode('note');
            document.getElementById('pill-snyder').classList.toggle('active', style === 'snyder');
            document.getElementById('pill-middle').classList.toggle('active', style === 'middle');
            updateIndicatorLabel();
        }

        function toggleMode(mode) {
            if (mode === 'color') {
                inputMode = (inputMode === 'color') ? 'number' : 'color';
                document.getElementById('mode-color-btn').classList.toggle('active', inputMode === 'color');
                if (inputMode === 'number') {
                    setInputMode('number');
                }
                updateIndicatorLabel();
            }
        }

        function selectColor(color) {
            activeColor = color;
            inputMode = 'color';
            document.getElementById('mode-color-btn').classList.add('active');
            document.getElementById('btn-mode-number').classList.remove('active');
            document.getElementById('btn-mode-note').classList.remove('active');
            
            if (selectedCell !== null) {
                colors[selectedCell] = color;
                updateBoardDOM();
            }
            updateIndicatorLabel();
        }

        function updateIndicatorLabel() {
            let label = 'Normal (Numbers)';
            if (inputMode === 'note') {
                label = noteStyle === 'snyder' ? 'Pencil Notes: Snyder (Corner)' : 'Pencil Notes: Middle (Center)';
            } else if (inputMode === 'color') {
                label = 'Color Highlighting';
            }
            document.getElementById('current-mode-label').innerText = label;
            document.getElementById('current-color-label').innerText = activeColor ? activeColor.toUpperCase() : 'None';
        }

        function handleKeyInput(num) {
            if (selectedCell === null || given[selectedCell]) return;

            if (inputMode === 'number') {
                board[selectedCell] = (board[selectedCell] === num) ? 0 : num;
                // Clear pencil notes when placing actual digit
                snyderNotes[selectedCell].clear();
                middleNotes[selectedCell].clear();
            } else if (inputMode === 'note') {
                if (board[selectedCell] === 0) {
                    if (noteStyle === 'snyder') {
                        if (snyderNotes[selectedCell].has(num)) {
                            snyderNotes[selectedCell].delete(num);
                        } else {
                            snyderNotes[selectedCell].add(num);
                        }
                    } else if (noteStyle === 'middle') {
                        if (middleNotes[selectedCell].has(num)) {
                            middleNotes[selectedCell].delete(num);
                        } else {
                            middleNotes[selectedCell].add(num);
                        }
                    }
                }
            }
            updateBoardDOM();
            updateKeypadCounts();
        }

        function clearSelection() {
            if (selectedCell === null || given[selectedCell]) return;
            if (inputMode === 'color') {
                colors[selectedCell] = null;
            } else {
                if (board[selectedCell] !== 0) {
                    board[selectedCell] = 0;
                } else {
                    snyderNotes[selectedCell].clear();
                    middleNotes[selectedCell].clear();
                }
            }
            updateBoardDOM();
            updateKeypadCounts();
        }

        function updateBoardDOM() {
            const cells = document.querySelectorAll('.cell');
            cells.forEach((cell, i) => {
                cell.className = 'cell';
                if (given[i]) cell.classList.add('given');
                else if (board[i] !== 0) cell.classList.add('user-input');
                
                if (i === selectedCell) cell.classList.add('selected');

                if (colors[i]) {
                    cell.style.backgroundColor = colorHexMap[colors[i]];
                    cell.style.color = '#0f172a';
                } else {
                    cell.style.backgroundColor = '';
                    cell.style.color = '';
                }

                // Render Main Value
                let valueSpan = cell.querySelector('.cell-val');
                if (!valueSpan) {
                    valueSpan = document.createElement('span');
                    valueSpan.className = 'cell-val';
                    cell.appendChild(valueSpan);
                }
                valueSpan.innerText = board[i] !== 0 ? board[i] : '';

                // Render Snyder (Corner/Edge) Notes
                const cornerGrid = cell.querySelector('.corner-notes-grid');
                if (cornerGrid) {
                    const noteCells = cornerGrid.querySelectorAll('.corner-note-cell');
                    noteCells.forEach(nc => {
                        const n = parseInt(nc.dataset.note);
                        nc.innerText = (board[i] === 0 && snyderNotes[i].has(n)) ? n : '';
                    });
                }

                // Render Middle (Center) Notes
                const centerEl = cell.querySelector('.center-notes');
                if (centerEl) {
                    if (board[i] === 0 && middleNotes[i].size > 0) {
                        const sortedNotes = Array.from(middleNotes[i]).sort((a, b) => a - b);
                        centerEl.innerText = sortedNotes.join(' ');
                    } else {
                        centerEl.innerText = '';
                    }
                }
            });
        }

        function updateKeypadCounts() {
            let counts = Array(10).fill(9);
            board.forEach(val => {
                if (val >= 1 && val <= 9) counts[val]--;
            });

            for (let i = 1; i <= 9; i++) {
                const countEl = document.getElementById(`count-${i}`);
                if (countEl) {
                    countEl.innerText = counts[i];
                    countEl.style.opacity = counts[i] === 0 ? '0.3' : '1';
                }
            }
        }

        // Physical keyboard support
        window.addEventListener('keydown', (e) => {
            if (e.key >= '1' && e.key <= '9') {
                handleKeyInput(parseInt(e.key));
            } else if (e.key === 'Backspace' || e.key === 'Delete') {
                clearSelection();
            } else if (e.key === 'n' || e.key === 'N') {
                setInputMode(inputMode === 'number' ? 'note' : 'number');
            } else if (e.key === 's' || e.key === 'S') {
                setNoteStyle('snyder');
            } else if (e.key === 'm' || e.key === 'M') {
                setNoteStyle('middle');
            } else if (selectedCell !== null) {
                const row = Math.floor(selectedCell / 9);
                const col = selectedCell % 9;
                if (e.key === 'ArrowUp' && row > 0) {
                    selectCellIndex(selectedCell - 9);
                } else if (e.key === 'ArrowDown' && row < 8) {
                    selectCellIndex(selectedCell + 9);
                } else if (e.key === 'ArrowLeft' && col > 0) {
                    selectCellIndex(selectedCell - 1);
                } else if (e.key === 'ArrowRight' && col < 8) {
                    selectCellIndex(selectedCell + 1);
                }
            }
        });

        window.onload = initGame;
    </script>
</body>
</html>
