<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <title>Advanced Sudoku with Chain Highlighting</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --border-color: #475569;
            --cell-bg: #0f172a;
            --cell-alt: #141f36;
            --cell-selected: #334155;
            --cell-highlight: #1e3a8a55;
            --given-color: #e2e8f0;
            --input-color: #60a5fa;
            --grid-line-thick: #f8fafc;
            --grid-line-thin: #334155;
            
            /* Highlighting Colors */
            --color-yellow: #fef08a;
            --color-green: #bbf7d0;
            --color-blue: #bfdbfe;
            --color-pink: #fbcfe8;
            --color-purple: #e9d5ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            touch-action: manipulation;
        }

        header {
            margin-bottom: 12px;
            text-align: center;
        }

        h1 {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .controls-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }

        select, button {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
            touch-action: manipulation;
        }

        button:hover, select:hover {
            background-color: var(--border-color);
        }

        button.active {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: var(--card-bg);
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
            max-width: 500px;
            width: 100%;
            transition: all 0.2s ease;
        }

        .game-content-layout {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            gap: 12px;
        }

        .board-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        /* MOBILE OPTIMIZATIONS (Pixel phone, smartphone) */
        @media (max-width: 600px) {
            body {
                padding: max(4px, env(safe-area-inset-top)) max(4px, env(safe-area-inset-right)) max(4px, env(safe-area-inset-bottom)) max(4px, env(safe-area-inset-left));
            }

            header {
                margin-bottom: 4px;
            }

            h1 {
                font-size: 1.15rem;
            }

            .game-container {
                padding: 6px 4px;
                border-radius: 8px;
                max-width: 100%;
                width: 100%;
                box-shadow: none;
                background: transparent;
            }

            .controls-bar {
                gap: 5px;
                margin-bottom: 6px;
            }

            select, button {
                padding: 6px 9px;
                font-size: 0.76rem;
            }

            .mode-indicators {
                font-size: 0.72rem;
                gap: 4px;
                margin-bottom: 6px;
            }

            .mode-indicators span {
                padding: 2px 6px;
            }

            .board {
                width: min(96vw, 380px) !important;
                margin-bottom: 6px;
            }

            .cell .cell-val {
                font-size: 1.05rem;
            }

            .keypad {
                gap: 5px;
            }

            .key-btn {
                min-height: 44px;
                padding: 3px 2px;
            }

            .key-btn .num {
                font-size: 1.15rem;
            }

            .key-btn span.count {
                font-size: 0.58rem;
            }

            .notes-controls-panel {
                padding: 6px 8px;
                gap: 6px;
            }

            .mode-btn {
                padding: 5px 8px;
                font-size: 0.78rem;
            }

            .note-type-toggle {
                padding-top: 4px;
            }

            .pill-toggle-btn {
                padding: 3px 8px;
                font-size: 0.7rem;
            }

            .palette {
                gap: 6px;
                margin-top: 2px;
            }

            .color-btn {
                width: 24px;
                height: 24px;
            }
        }

        /* TABLET PORTRAIT (Pixel Tablet portrait) */
        @media (min-width: 601px) and (max-width: 1024px) and (orientation: portrait) {
            .game-container {
                max-width: 680px;
                padding: 22px;
            }

            .board {
                max-width: 600px;
            }

            .cell .cell-val {
                font-size: 1.45rem;
            }

            .key-btn {
                min-height: 56px;
            }

            .key-btn .num {
                font-size: 1.35rem;
            }
        }

        /* TABLET LANDSCAPE / WIDESCREEN (Pixel Tablet landscape) */
        @media (min-width: 768px) and (orientation: landscape) {
            body {
                justify-content: center;
                padding: max(8px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
            }

            header {
                display: none;
            }

            .game-container {
                max-width: 1050px;
                width: 98vw;
                padding: 12px 18px;
                max-height: 98dvh;
            }

            .controls-bar {
                margin-bottom: 6px;
                justify-content: space-between;
            }

            .mode-indicators {
                margin-bottom: 8px;
            }

            .game-content-layout {
                flex-direction: row;
                align-items: center;
                justify-content: center;
                gap: 24px;
                width: 100%;
            }

            .board-wrapper {
                flex: 1.15;
                max-width: min(74vh, 560px);
            }

            .board {
                width: 100%;
                margin-bottom: 0;
            }

            .keypad-container {
                flex: 0.85;
                max-width: 440px;
                display: flex;
                flex-direction: column;
                gap: 10px;
            }
        }
        .mode-indicators {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            font-size: 0.82rem;
            color: #94a3b8;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }

        .mode-indicators span {
            padding: 3px 10px;
            border-radius: 4px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            display: inline-flex;
            align-items: center;
        }

        /* 9x9 Sudoku Board with Clear 3x3 Block Boundaries */
        .board {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            width: 100%;
            aspect-ratio: 1;
            border: 3.5px solid var(--grid-line-thick);
            border-radius: 6px;
            overflow: hidden;
            background-color: var(--cell-bg);
            margin-bottom: 14px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .cell {
            background-color: var(--cell-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            position: relative;
            transition: background-color 0.1s;
            border-right: 1px solid var(--grid-line-thin);
            border-bottom: 1px solid var(--grid-line-thin);
            box-sizing: border-box;
        }

        /* Subtle alternating block shading for instant 3x3 pattern recognition */
        .cell.block-alt {
            background-color: var(--cell-alt);
        }

        /* Prominent thick 3x3 block boundary dividers */
        .cell.border-right-thick {
            border-right: 3px solid var(--grid-line-thick) !important;
        }

        .cell.border-bottom-thick {
            border-bottom: 3px solid var(--grid-line-thick) !important;
        }

        .cell.border-right-none {
            border-right: none !important;
        }

        .cell.border-bottom-none {
            border-bottom: none !important;
        }

        /* Cell Numbers */
        .cell .cell-val {
            font-size: 1.15rem;
            font-weight: 600;
            line-height: 1;
            z-index: 5;
        }

        .cell.given .cell-val {
            color: var(--given-color);
            font-weight: 700;
        }

        .cell.user-input .cell-val {
            color: var(--input-color);
            font-weight: 600;
        }

        .cell.selected {
            background-color: var(--cell-selected) !important;
        }

        .cell.highlighted {
            background-color: var(--cell-highlight);
        }

        /* Error States in Vibrant Red */
        .cell.error {
            background-color: rgba(239, 68, 68, 0.25) !important;
        }

        .cell.error .cell-val {
            color: #ef4444 !important;
            font-weight: 700 !important;
            text-shadow: 0 0 8px rgba(239, 68, 68, 0.7);
        }

        .cell.error.selected {
            background-color: rgba(239, 68, 68, 0.4) !important;
            outline: 2px solid #ef4444;
            outline-offset: -2px;
        }

        /* Snyder (Corner/Edge) Notes Grid (3x3) */
        .corner-notes-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            padding: 1px 2px;
            font-size: 0.5rem;
            line-height: 1;
            color: #94a3b8;
            pointer-events: none;
            z-index: 2;
        }

        .corner-note-cell {
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 500;
        }

        /* Middle (Center) Notes Cluster */
        .center-notes {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.58rem;
            font-weight: 600;
            line-height: 1;
            color: #38bdf8;
            pointer-events: none;
            letter-spacing: 0.5px;
            z-index: 3;
            max-width: 90%;
            text-align: center;
            word-break: break-all;
        }

        /* Keypad Container */
        .keypad-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* 5x2 Keypad Grid (1-5, 6-9, Erase) */
        .keypad {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            width: 100%;
        }

        .key-btn {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 4px;
            min-height: 50px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-color);
            transition: all 0.15s ease;
            user-select: none;
            box-sizing: border-box;
        }

        .key-btn .num {
            font-size: 1.25rem;
            font-weight: 600;
            line-height: 1.1;
        }

        .key-btn span.count {
            font-size: 0.65rem;
            color: #94a3b8;
            font-weight: 500;
            margin-top: 2px;
        }

        .key-btn:hover {
            background: var(--border-color);
            transform: translateY(-1px);
        }

        .key-btn:active {
            transform: translateY(0);
        }

        .key-btn.erase-btn {
            border-color: rgba(239, 68, 68, 0.4);
            color: #f87171;
        }

        .key-btn.erase-btn:hover {
            background: rgba(239, 68, 68, 0.15);
            border-color: #f87171;
        }

        .key-btn.erase-btn span.count {
            color: #fca5a5;
        }

        /* Notes Controls Panel Directly Under Numbers */
        .notes-controls-panel {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 10px;
            box-sizing: border-box;
        }

        .mode-toggle-group {
            display: flex;
            gap: 6px;
            width: 100%;
        }

        .mode-btn {
            flex: 1;
            padding: 7px 10px;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            border-radius: 6px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: #94a3b8;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .mode-btn:hover {
            color: var(--text-color);
            border-color: #64748b;
        }

        .mode-btn.active {
            background: var(--accent-color);
            border-color: var(--accent-color);
            color: #ffffff;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.4);
        }

        .note-type-toggle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding-top: 6px;
            border-top: 1px solid rgba(71, 85, 105, 0.4);
        }

        .note-type-toggle .sub-label {
            font-size: 0.75rem;
            color: #94a3b8;
            font-weight: 500;
        }

        .pill-group {
            display: flex;
            gap: 6px;
        }

        .pill-toggle-btn {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: #94a3b8;
            border-radius: 20px;
            padding: 4px 10px;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.15s ease;
        }

        .pill-toggle-btn .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #64748b;
        }

        .pill-toggle-btn:hover {
            color: var(--text-color);
            border-color: #64748b;
        }

        .pill-toggle-btn.active {
            background: #1e3a8a;
            border-color: #3b82f6;
            color: #ffffff;
            font-weight: 600;
        }

        .pill-toggle-btn.active .dot {
            background: #60a5fa;
            box-shadow: 0 0 6px #60a5fa;
        }

        /* Color Palette */
        .palette {
            display: flex;
            gap: 8px;
            justify-content: center;
            align-items: center;
            margin-top: 2px;
        }

        .color-btn {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 2px solid var(--border-color);
            cursor: pointer;
            transition: transform 0.1s;
        }

        .color-btn:hover {
            transform: scale(1.15);
        }

        .color-btn.yellow { background-color: var(--color-yellow); }
        .color-btn.green { background-color: var(--color-green); }
        .color-btn.blue { background-color: var(--color-blue); }
        .color-btn.pink { background-color: var(--color-pink); }
        .color-btn.purple { background-color: var(--color-purple); }
        .color-btn.clear { background-color: var(--card-bg); display: flex; align-items: center; justify-content: center; font-size: 0.7rem; }
    </style>
</head>
<body>

    <header>
        <h1>Sudoku Solver & Chain Analyzer</h1>
    </header>

    <div class="game-container">
        <div class="controls-bar">
            <select id="difficulty" onchange="onDifficultyChange()">
                <option value="easy">Easy (~36 Clues)</option>
                <option value="medium" selected>Medium (~30 Clues)</option>
                <option value="hard">Hard (~26 Clues)</option>
                <option value="expert">Expert (~24 Clues)</option>
            </select>
            <button onclick="generateNewUnlimited()" title="Instantly generate an infinite new puzzle">✨ New Puzzle</button>
            <button onclick="nextCatalogPuzzle()" title="Play from the curated catalog">Catalog (#<span id="puzzle-num">1</span>/25)</button>
            <button onclick="toggleMode('color')" id="mode-color-btn">Color</button>
            <button onclick="restartGame()">Reset</button>
            <button onclick="toggleFullscreen()" id="fs-btn" title="Toggle Fullscreen for Mobile and Tablet">⛶ Fullscreen</button>
        </div>

        <div class="mode-indicators">
            <span>Level: <strong id="level-label" style="margin-left: 4px;">Medium #1</strong></span>
            <span>Clues: <strong id="clues-label" style="margin-left: 4px;">30</strong></span>
            <span>Input: <strong id="current-mode-label" style="margin-left: 4px;">Normal (Numbers)</strong></span>
            <span>Highlight: <strong id="current-color-label" style="margin-left: 4px;">None</strong></span>
            <span id="error-status" style="display:none; color: #ef4444; border-color: rgba(239, 68, 68, 0.4); font-weight: 600;"></span>
        </div>

        <div class="game-content-layout">
            <!-- 9x9 Sudoku Board -->
            <div class="board-wrapper">
                <div class="board" id="sudoku-board"></div>
            </div>

            <div class="keypad-container">
            <!-- 5x2 Keypad: 1-5 top row, 6-9 + Erase bottom row -->
            <div class="keypad" id="keypad"></div>

            <!-- Pencil Notes Option Directly Under Actual Numbers -->
            <div class="notes-controls-panel">
                <div class="mode-toggle-group">
                    <button id="btn-mode-number" class="mode-btn active" onclick="setInputMode('number')">
                        <span>🔢</span> Normal Numbers
                    </button>
                    <button id="btn-mode-note" class="mode-btn" onclick="setInputMode('note')">
                        <span>✏️</span> Pencil Notes
                    </button>
                </div>

                <div class="note-type-toggle">
                    <span class="sub-label">Notes Type:</span>
                    <div class="pill-group">
                        <button id="pill-snyder" class="pill-toggle-btn active" onclick="setNoteStyle('snyder')" title="Snyder notation (corner/edge marks)">
                            <span class="dot"></span> Snyder (Corner)
                        </button>
                        <button id="pill-middle" class="pill-toggle-btn" onclick="setNoteStyle('middle')" title="Center/middle candidate notes">
                            <span class="dot"></span> Middle (Center)
                        </button>
                    </div>
                </div>
            </div>

            <!-- Chain / Cell Highlighting Palette -->
            <div class="palette">
                <div class="color-btn yellow" onclick="selectColor('yellow')" title="Highlight Yellow"></div>
                <div class="color-btn green" onclick="selectColor('green')" title="Highlight Green"></div>
                <div class="color-btn blue" onclick="selectColor('blue')" title="Highlight Blue"></div>
                <div class="color-btn pink" onclick="selectColor('pink')" title="Highlight Pink"></div>
                <div class="color-btn purple" onclick="selectColor('purple')" title="Highlight Purple"></div>
                <div class="color-btn clear" onclick="selectColor(null)" title="Remove Color">✕</div>
            </div>
        </div>
    </div>
    </div>

        function solveSudoku(grid) {
            const s = [...grid];
            function isValid(idx, num) {
                const r = Math.floor(idx / 9);
                const c = idx % 9;
                const br = Math.floor(r / 3) * 3;
                const bc = Math.floor(c / 3) * 3;
                for (let i = 0; i < 9; i++) {
                    if (s[r * 9 + i] === num) return false;
                    if (s[i * 9 + c] === num) return false;
                    const bi = br + Math.floor(i / 3);
                    const bj = bc + (i % 3);
                    if (s[bi * 9 + bj] === num) return false;
                }
                return true;
            }
            function solve(idx = 0) {
                if (idx === 81) return true;
                if (s[idx] !== 0) return solve(idx + 1);
                for (let num = 1; num <= 9; num++) {
                    if (isValid(idx, num)) {
                        s[idx] = num;
                        if (solve(idx + 1)) return true;
                        s[idx] = 0;
                    }
                }
                return false;
            }
            solve();
            return s;
        }

        let puzzleCounters = { easy: 0, medium: 0, hard: 0, expert: 0 };
        const clueTargets = { easy: 36, medium: 30, hard: 26, expert: 23 };

        function countSolutions(grid, limit = 2) {
            let count = 0;
            function solve() {
                if (count >= limit) return;
                let minCandidates = 10;
                let bestIdx = -1;
                let bestNums = [];
                for (let idx = 0; idx < 81; idx++) {
                    if (grid[idx] === 0) {
                        const r = Math.floor(idx / 9);
                        const c = idx % 9;
                        const br = Math.floor(r / 3) * 3;
                        const bc = Math.floor(c / 3) * 3;
                        const used = new Set();
                        for (let i = 0; i < 9; i++) {
                            used.add(grid[r * 9 + i]);
                            used.add(grid[i * 9 + c]);
                            used.add(grid[(br + Math.floor(i / 3)) * 9 + bc + (i % 3)]);
                        }
                        const avail = [];
                        for (let num = 1; num <= 9; num++) {
                            if (!used.has(num)) avail.push(num);
                        }
                        if (avail.length < minCandidates) {
                            minCandidates = avail.length;
                            bestIdx = idx;
                            bestNums = avail;
                            if (minCandidates <= 1) break;
                        }
                    }
                }
                if (bestIdx === -1) {
                    count++;
                    return;
                }
                if (bestNums.length === 0) return;
                for (const num of bestNums) {
                    grid[bestIdx] = num;
                    solve();
                    grid[bestIdx] = 0;
                    if (count >= limit) return;
                }
            }
            solve();
            return count;
        }

        function generateFullGrid() {
            const grid = new Array(81).fill(0);
            for (let box = 0; box < 3; box++) {
                const nums = [1,2,3,4,5,6,7,8,9].sort(() => Math.random() - 0.5);
                const startR = box * 3;
                const startC = box * 3;
                let idx = 0;
                for (let r = 0; r < 3; r++) {
                    for (let c = 0; c < 3; c++) {
                        grid[(startR + r) * 9 + (startC + c)] = nums[idx++];
                    }
                }
            }
            function fillRemaining(idx = 0) {
                if (idx === 81) return true;
                if (grid[idx] !== 0) return fillRemaining(idx + 1);
                const r = Math.floor(idx / 9);
                const c = idx % 9;
                const br = Math.floor(r / 3) * 3;
                const bc = Math.floor(c / 3) * 3;
                const used = new Set();
                for (let i = 0; i < 9; i++) {
                    used.add(grid[r * 9 + i]);
                    used.add(grid[i * 9 + c]);
                    used.add(grid[(br + Math.floor(i / 3)) * 9 + bc + (i % 3)]);
                }
                const nums = [];
                for (let num = 1; num <= 9; num++) {
                    if (!used.has(num)) nums.push(num);
                }
                nums.sort(() => Math.random() - 0.5);
                for (const num of nums) {
                    grid[idx] = num;
                    if (fillRemaining(idx + 1)) return true;
                    grid[idx] = 0;
                }
                return false;
            }
            fillRemaining();
            return grid;
        }

        function generateLivePuzzle(targetClues) {
            const grid = generateFullGrid();
            const positions = Array.from({length: 81}, (_, i) => i).sort(() => Math.random() - 0.5);
            let clues = 81;
            for (const pos of positions) {
                if (clues <= targetClues) break;
                const val = grid[pos];
                grid[pos] = 0;
                if (countSolutions([...grid], 2) === 1) {
                    clues--;
                } else {
                    grid[pos] = val;
                }
            }
            return { puzzle: grid.join(''), clues };
        }

        function generateNewUnlimited() {
            currentDifficulty = document.getElementById('difficulty').value;
            puzzleCounters[currentDifficulty]++;
            const target = clueTargets[currentDifficulty] || 30;
            const res = generateLivePuzzle(target);
            loadPuzzleString(res.puzzle, `${currentDifficulty.charAt(0).toUpperCase() + currentDifficulty.slice(1)} #${puzzleCounters[currentDifficulty]} (Unlimited)`, res.clues);
        }

        function onDifficultyChange() {
            currentDifficulty = document.getElementById('difficulty').value;
            generateNewUnlimited();
        }

        function nextCatalogPuzzle() {
            currentDifficulty = document.getElementById('difficulty').value;
            const list = puzzles[currentDifficulty] || puzzles.medium;
            puzzleIndices[currentDifficulty] = (puzzleIndices[currentDifficulty] + 1) % list.length;
            const puzStr = list[puzzleIndices[currentDifficulty]];
            const diffName = currentDifficulty.charAt(0).toUpperCase() + currentDifficulty.slice(1);
            const numEl = document.getElementById('puzzle-num');
            if (numEl) numEl.innerText = (puzzleIndices[currentDifficulty] + 1);
            const clueCount = puzStr.split('').filter(c => c !== '0').length;
            loadPuzzleString(puzStr, `${diffName} #${puzzleIndices[currentDifficulty] + 1} (Catalog)`, clueCount);
        }

        function newGame() {
            generateNewUnlimited();
        }

        function loadPuzzleString(puzzleStr, title, clueCount) {
            board = puzzleStr.split('').map(Number);
            initialBoard = [...board];
            given = board.map(val => val !== 0);
            solution = solveSudoku(board);
            snyderNotes = Array(81).fill().map(() => new Set());
            middleNotes = Array(81).fill().map(() => new Set());
            colors = Array(81).fill(null);
            selectedCell = null;

            const levelEl = document.getElementById('level-label');
            if (levelEl) levelEl.innerText = title;
            const cluesEl = document.getElementById('clues-label');
            if (cluesEl) cluesEl.innerText = clueCount || board.filter(c => c !== 0).length;

            updateBoardDOM();
            updateKeypadCounts();
        }

            middleNotes = Array(81).fill().map(() => new Set());
            colors = Array(81).fill(null);

        function getErrorCells() {
            const errorSet = new Set();
            
            for (let i = 0; i < 81; i++) {
                const val = board[i];
                if (val === 0) continue;

                const r = Math.floor(i / 9);
                const c = i % 9;
                const br = Math.floor(r / 3) * 3;
                const bc = Math.floor(c / 3) * 3;

                // Check conflict with any other cell in the same row, column, or 3x3 block
                for (let j = 0; j < 81; j++) {
                    if (i === j || board[j] !== val) continue;
                    const r2 = Math.floor(j / 9);
                    const c2 = j % 9;
                    const br2 = Math.floor(r2 / 3) * 3;
                    const bc2 = Math.floor(c2 / 3) * 3;

                    if (r === r2 || c === c2 || (br === br2 && bc === bc2)) {
                        if (!given[i]) errorSet.add(i);
                        if (!given[j]) errorSet.add(j);
                    }
                }

                // Check if user entry contradicts the true solution
                if (!given[i] && solution.length === 81 && solution[i] !== 0 && val !== solution[i]) {
                    errorSet.add(i);
                }
            }

            return errorSet;
        }

        function handleKeyInput(num) {
            if (selectedCell === null || given[selectedCell]) return;

            if (inputMode === 'number') {
                board[selectedCell] = (board[selectedCell] === num) ? 0 : num;
                // Clear pencil notes when placing actual digit
                snyderNotes[selectedCell].clear();
                middleNotes[selectedCell].clear();
            } else if (inputMode === 'note') {
                if (board[selectedCell] === 0) {
                    if (noteStyle === 'snyder') {
                        if (snyderNotes[selectedCell].has(num)) {
                            snyderNotes[selectedCell].delete(num);
                        } else {
                            snyderNotes[selectedCell].add(num);
                        }
                    } else if (noteStyle === 'middle') {
                        if (middleNotes[selectedCell].has(num)) {
                            middleNotes[selectedCell].delete(num);
                        } else {
                            middleNotes[selectedCell].add(num);
                        }
                    }
                }
            }
            updateBoardDOM();
            updateKeypadCounts();
        }

        function clearSelection() {
            if (selectedCell === null || given[selectedCell]) return;
            if (inputMode === 'color') {
                colors[selectedCell] = null;
            } else {
                if (board[selectedCell] !== 0) {
                    board[selectedCell] = 0;
                } else {
                    snyderNotes[selectedCell].clear();
                    middleNotes[selectedCell].clear();
                }
            }
            updateBoardDOM();
            updateKeypadCounts();
        }

        function updateBoardDOM() {
            const cells = document.querySelectorAll('.cell');
            const errorCells = getErrorCells();

            cells.forEach((cell, i) => {
                const row = Math.floor(i / 9);
                const col = i % 9;
                const block = Math.floor(row / 3) * 3 + Math.floor(col / 3);

                cell.className = 'cell';
                if (block % 2 === 0) cell.classList.add('block-alt');
                if (col === 2 || col === 5) cell.classList.add('border-right-thick');
                else if (col === 8) cell.classList.add('border-right-none');

                if (row === 2 || row === 5) cell.classList.add('border-bottom-thick');
                else if (row === 8) cell.classList.add('border-bottom-none');

                if (given[i]) cell.classList.add('given');
                else if (board[i] !== 0) cell.classList.add('user-input');
                
                if (i === selectedCell) cell.classList.add('selected');

                // Error Highlight in Red
                if (errorCells.has(i)) {
                    cell.classList.add('error');
                }

                if (colors[i]) {
                    cell.style.backgroundColor = colorHexMap[colors[i]];
                    cell.style.color = '#0f172a';
                } else {
                    cell.style.backgroundColor = '';
                    cell.style.color = '';
                }

                // Render Main Value
                let valueSpan = cell.querySelector('.cell-val');
                if (!valueSpan) {
                    valueSpan = document.createElement('span');
                    valueSpan.className = 'cell-val';
                    cell.appendChild(valueSpan);
                }
                valueSpan.innerText = board[i] !== 0 ? board[i] : '';

                // Render Snyder (Corner/Edge) Notes
                const cornerGrid = cell.querySelector('.corner-notes-grid');
                if (cornerGrid) {
                    const noteCells = cornerGrid.querySelectorAll('.corner-note-cell');
                    noteCells.forEach(nc => {
                        const n = parseInt(nc.dataset.note);
                        nc.innerText = (board[i] === 0 && snyderNotes[i].has(n)) ? n : '';
                    });
                }

                // Render Middle (Center) Notes
                const centerEl = cell.querySelector('.center-notes');
                if (centerEl) {
                    if (board[i] === 0 && middleNotes[i].size > 0) {
                        const sortedNotes = Array.from(middleNotes[i]).sort((a, b) => a - b);
                        centerEl.innerText = sortedNotes.join(' ');
                    } else {
                        centerEl.innerText = '';
                    }
                }
            });

            // Update error indicator in status bar
            const errorStatusEl = document.getElementById('error-status');
            if (errorStatusEl) {
                if (errorCells.size > 0) {
                    errorStatusEl.style.display = 'inline-flex';
                    errorStatusEl.innerText = `⚠️ ${errorCells.size} Error${errorCells.size > 1 ? 's' : ''}`;
                } else {
                    errorStatusEl.style.display = 'none';
                }
            }
        }

        function updateKeypadCounts() {
            let counts = Array(10).fill(9);
            board.forEach(val => {
                if (val >= 1 && val <= 9) counts[val]--;
            });

            for (let i = 1; i <= 9; i++) {
                const countEl = document.getElementById(`count-${i}`);
                if (countEl) {
                    countEl.innerText = counts[i];
                    countEl.style.opacity = counts[i] === 0 ? '0.3' : '1';
                }
            }
        }

        // Physical keyboard support
        window.addEventListener('keydown', (e) => {
            if (e.key >= '1' && e.key <= '9') {
                handleKeyInput(parseInt(e.key));
            } else if (e.key === 'Backspace' || e.key === 'Delete') {
                clearSelection();
            } else if (e.key === 'n' || e.key === 'N') {
                setInputMode(inputMode === 'number' ? 'note' : 'number');
            } else if (e.key === 's' || e.key === 'S') {
                setNoteStyle('snyder');
            } else if (e.key === 'm' || e.key === 'M') {
                setNoteStyle('middle');
            } else if (selectedCell !== null) {
                const row = Math.floor(selectedCell / 9);
                const col = selectedCell % 9;
                if (e.key === 'ArrowUp' && row > 0) {
                    selectCellIndex(selectedCell - 9);
                } else if (e.key === 'ArrowDown' && row < 8) {
                    selectCellIndex(selectedCell + 9);
                } else if (e.key === 'ArrowLeft' && col > 0) {
                    selectCellIndex(selectedCell - 1);
                } else if (e.key === 'ArrowRight' && col < 8) {
                    selectCellIndex(selectedCell + 1);
                }
            }
        });

        window.onload = initGame;
    </script>
</body>
</html>
