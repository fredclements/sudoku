<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <title>Advanced Sudoku with Chain Highlighting</title>
    <style>
        :root, [data-theme="dark"] {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --subtext-color: #94a3b8;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --border-color: #475569;
            --panel-bg: rgba(15, 23, 42, 0.6);
            --cell-bg: #0f172a;
            --cell-alt: #141f36;
            --cell-selected: #334155;
            --cell-highlight: #1e3a8a55;
            --given-color: #f8fafc;
            --input-color: #34d399;
            --grid-line-thick: #f8fafc;
            --grid-line-thin: #334155;
            --notes-corner: #38bdf8;
            --notes-center: #38bdf8;
            
            /* Highlighting Colors */
            --color-yellow: #fef08a;
            --color-green: #bbf7d0;
            --color-blue: #bfdbfe;
            --color-pink: #fbcfe8;
            --color-purple: #e9d5ff;
        }

        [data-theme="light"] {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --subtext-color: #64748b;
            --accent-color: #2563eb;
            --accent-hover: #1d4ed8;
            --border-color: #cbd5e1;
            --panel-bg: #f8fafc;
            --cell-bg: #ffffff;
            --cell-alt: #f8fafc;
            --cell-selected: #e2e8f0;
            --cell-highlight: #bfdbfe77;
            --given-color: #0f172a;
            --input-color: #059669;
            --grid-line-thick: #0f172a;
            --grid-line-thin: #cbd5e1;
            --notes-corner: #0284c7;
            --notes-center: #0284c7;
            
            /* Highlighting Colors */
            --color-yellow: #fef08a;
            --color-green: #bbf7d0;
            --color-blue: #bfdbfe;
            --color-pink: #fbcfe8;
            --color-purple: #e9d5ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            touch-action: manipulation;
        }

        header {
            margin-bottom: 12px;
            text-align: center;
        }

        h1 {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .controls-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }

        select, button {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
            touch-action: manipulation;
        }

        button:hover, select:hover {
            background-color: var(--border-color);
        }

        button.active {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: var(--card-bg);
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
            max-width: 500px;
            width: 100%;
            transition: all 0.2s ease;
        }

        .game-content-layout {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            gap: 12px;
        }

        .board-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        /* Completely suppress any Netlify injected badges, preview bars or drawers */
        #netlify-badge,
        [data-netlify-badge],
        .netlify-badge,
        iframe[src*="netlify"],
        iframe[id*="netlify"],
        [data-netlify-drawer],
        [data-netlify-feedback],
        .netlify-drawer-container {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
            pointer-events: none !important;
            height: 0 !important;
            width: 0 !important;
            position: absolute !important;
            z-index: -9999 !important;
        }

        /* MOBILE OPTIMIZATIONS (Pixel phone, smartphone) - Enhanced Typography */
        @media (max-width: 600px) {
            body {
                padding: max(6px, env(safe-area-inset-top)) max(6px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(6px, env(safe-area-inset-left));
            }

            header {
                margin-bottom: 6px;
            }

            h1 {
                font-size: 1.25rem;
            }

            .game-container {
                padding: 6px 4px;
                border-radius: 8px;
                max-width: 100%;
                width: 100%;
                box-shadow: none;
                background: transparent;
            }

            .controls-bar {
                gap: 6px;
                margin-bottom: 8px;
            }

            select, button {
                padding: 7px 11px;
                font-size: 0.84rem;
                font-weight: 600;
            }

            .mode-indicators {
                font-size: 0.82rem;
                gap: 5px;
                margin-bottom: 8px;
            }

            .mode-indicators span {
                padding: 3px 8px;
            }

            .board {
                width: min(96vw, 395px) !important;
                margin-bottom: 8px;
            }

            /* Bigger, clearer cell numbers on mobile */
            .cell .cell-val {
                font-size: 1.25rem;
                font-weight: 700;
            }

            /* Bigger, bolder, high-legibility Snyder corner notes on mobile */
            .corner-notes-grid {
                font-size: clamp(11.5px, 3.2vw, 14.5px);
                font-weight: 800;
                padding: 1px;
            }

            .corner-note-cell {
                font-weight: 800;
            }

            /* Bigger, bolder Middle notes on mobile */
            .center-notes {
                font-size: clamp(13px, 3.8vw, 17px);
                font-weight: 800;
            }

            .keypad {
                gap: 6px;
            }

            .key-btn {
                min-height: 48px;
                padding: 4px 2px;
            }

            /* Bigger keypad numbers */
            .key-btn .num {
                font-size: 1.35rem;
                font-weight: 700;
            }

            .key-btn span.count {
                font-size: 0.68rem;
                font-weight: 600;
            }

            .notes-controls-panel {
                padding: 8px 10px;
                gap: 8px;
            }

            .mode-btn {
                padding: 7px 10px;
                font-size: 0.84rem;
                font-weight: 600;
            }

            .note-type-toggle {
                padding-top: 6px;
            }

            .note-type-toggle .sub-label {
                font-size: 0.8rem;
                font-weight: 600;
            }

            .pill-toggle-btn {
                padding: 4px 10px;
                font-size: 0.78rem;
                font-weight: 600;
            }

            .palette {
                gap: 8px;
                margin-top: 4px;
                padding-bottom: 12px;
            }

            .color-btn {
                width: 28px;
                height: 28px;
            }
        }

        /* TABLET PORTRAIT (Pixel Tablet portrait) */
        @media (min-width: 601px) and (max-width: 1024px) and (orientation: portrait) {
            .game-container {
                max-width: 680px;
                padding: 22px;
            }

            .board {
                max-width: 600px;
            }

            .cell .cell-val {
                font-size: 1.45rem;
            }

            .key-btn {
                min-height: 56px;
            }

            .key-btn .num {
                font-size: 1.35rem;
            }
        }

        /* TABLET LANDSCAPE / WIDESCREEN (Pixel Tablet landscape) */
        @media (min-width: 768px) and (orientation: landscape) {
            body {
                justify-content: center;
                padding: max(8px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
            }

            header {
                display: none;
            }

            .game-container {
                max-width: 1050px;
                width: 98vw;
                padding: 12px 18px;
                max-height: 98dvh;
            }

            .controls-bar {
                margin-bottom: 6px;
                justify-content: space-between;
            }

            .mode-indicators {
                margin-bottom: 8px;
            }

            .game-content-layout {
                flex-direction: row;
                align-items: center;
                justify-content: center;
                gap: 24px;
                width: 100%;
            }

            .board-wrapper {
                flex: 1.15;
                max-width: min(74vh, 560px);
            }

            .board {
                width: 100%;
                margin-bottom: 0;
            }

            .keypad-container {
                flex: 0.85;
                max-width: 440px;
                display: flex;
                flex-direction: column;
                gap: 10px;
            }
        }
        .mode-indicators {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            font-size: 0.82rem;
            color: #94a3b8;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }

        .mode-indicators span {
            padding: 3px 10px;
            border-radius: 4px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            display: inline-flex;
            align-items: center;
        }

        /* 9x9 Sudoku Board with Clear 3x3 Block Boundaries */
        .board {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            width: 100%;
            aspect-ratio: 1;
            border: 3.5px solid var(--grid-line-thick);
            border-radius: 6px;
            overflow: hidden;
            background-color: var(--cell-bg);
            margin-bottom: 14px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .cell {
            background-color: var(--cell-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            position: relative;
            transition: background-color 0.1s;
            border-right: 1px solid var(--grid-line-thin);
            border-bottom: 1px solid var(--grid-line-thin);
            box-sizing: border-box;
        }

        /* Subtle alternating block shading for instant 3x3 pattern recognition */
        .cell.block-alt {
            background-color: var(--cell-alt);
        }

        /* Prominent thick 3x3 block boundary dividers */
        .cell.border-right-thick {
            border-right: 3px solid var(--grid-line-thick) !important;
        }

        .cell.border-bottom-thick {
            border-bottom: 3px solid var(--grid-line-thick) !important;
        }

        .cell.border-right-none {
            border-right: none !important;
        }

        .cell.border-bottom-none {
            border-bottom: none !important;
        }

        /* Cell Numbers */
        .cell .cell-val {
            font-size: 1.3rem;
            font-weight: 700;
            line-height: 1;
            z-index: 5;
        }

        .cell.given .cell-val {
            color: var(--given-color);
            font-weight: 700;
        }

        .cell.user-input .cell-val {
            color: var(--input-color);
            font-weight: 700;
        }

        .cell.user-input.matching-digit .cell-val {
            color: var(--input-color) !important;
            text-shadow: 0 0 10px rgba(52, 211, 153, 0.7);
        }

        [data-theme="light"] .cell.user-input.matching-digit .cell-val {
            color: var(--input-color) !important;
            text-shadow: none;
        }

        .cell.selected {
            background-color: var(--cell-selected) !important;
        }

        .cell.highlighted {
            background-color: var(--cell-highlight);
        }

        /* Error States in Vibrant Red */
        .cell.error {
            background-color: rgba(239, 68, 68, 0.25) !important;
        }

        .cell.error .cell-val {
            color: #ef4444 !important;
            font-weight: 700 !important;
            text-shadow: 0 0 8px rgba(239, 68, 68, 0.7);
        }

        .cell.error.selected {
            background-color: rgba(239, 68, 68, 0.4) !important;
            outline: 2px solid #ef4444;
            outline-offset: -2px;
        }

        /* Snyder (Corner/Edge) Notes Grid (3x3) - Enhanced Visibility & Legibility */
        .corner-notes-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            padding: 1px;
            font-size: clamp(11px, 2.4vw, 14px);
            line-height: 1;
            color: var(--notes-corner);
            pointer-events: none;
            z-index: 2;
        }

        .corner-note-cell {
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            color: var(--notes-corner);
        }

        /* Middle (Center) Notes Cluster */
        .center-notes {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(13px, 3vw, 17px);
            font-weight: 800;
            line-height: 1;
            color: var(--notes-center);
            pointer-events: none;
            letter-spacing: 0.5px;
            z-index: 3;
            max-width: 90%;
            text-align: center;
            word-break: break-all;
        }

        /* Keypad Container */
        .keypad-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-bottom: 16px;
        }

        /* 5x2 Keypad Grid (1-5, 6-9, Erase) */
        .keypad {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            width: 100%;
        }

        .key-btn {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 4px;
            min-height: 50px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-color);
            transition: all 0.15s ease;
            user-select: none;
            box-sizing: border-box;
        }

        .key-btn .num {
            font-size: 1.25rem;
            font-weight: 600;
            line-height: 1.1;
        }

        .key-btn span.count {
            font-size: 0.65rem;
            color: #94a3b8;
            font-weight: 500;
            margin-top: 2px;
        }

        .key-btn:hover {
            background: var(--border-color);
            transform: translateY(-1px);
        }

        .key-btn:active {
            transform: translateY(0);
        }

        .key-btn.erase-btn {
            border-color: rgba(239, 68, 68, 0.4);
            color: #f87171;
        }

        .key-btn.erase-btn:hover {
            background: rgba(239, 68, 68, 0.15);
            border-color: #f87171;
        }

        .key-btn.erase-btn span.count {
            color: #fca5a5;
        }

        /* Notes Controls Panel Directly Under Numbers */
        .notes-controls-panel {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 10px;
            box-sizing: border-box;
        }

        .mode-toggle-group {
            display: flex;
            gap: 6px;
            width: 100%;
        }

        .mode-btn {
            flex: 1;
            padding: 7px 10px;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            border-radius: 6px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: #94a3b8;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .mode-btn:hover {
            color: var(--text-color);
            border-color: #64748b;
        }

        .mode-btn.active {
            background: var(--accent-color);
            border-color: var(--accent-color);
            color: #ffffff;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.4);
        }

        .note-type-toggle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding-top: 6px;
            border-top: 1px solid rgba(71, 85, 105, 0.4);
        }

        .note-type-toggle .sub-label {
            font-size: 0.75rem;
            color: #94a3b8;
            font-weight: 500;
        }

        .pill-group {
            display: flex;
            gap: 6px;
        }

        .pill-toggle-btn {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: #94a3b8;
            border-radius: 20px;
            padding: 4px 10px;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.15s ease;
        }

        .pill-toggle-btn .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #64748b;
        }

        .pill-toggle-btn:hover {
            color: var(--text-color);
            border-color: #64748b;
        }

        .pill-toggle-btn.active {
            background: #1e3a8a;
            border-color: #3b82f6;
            color: #ffffff;
            font-weight: 600;
        }

        .pill-toggle-btn.active .dot {
            background: #60a5fa;
            box-shadow: 0 0 6px #60a5fa;
        }

        /* Color Palette */
        .palette {
            display: flex;
            gap: 8px;
            justify-content: center;
            align-items: center;
            margin-top: 2px;
        }

        .color-btn {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 2px solid var(--border-color);
            cursor: pointer;
            transition: transform 0.1s;
        }

        .color-btn:hover {
            transform: scale(1.15);
        }

        .color-btn.yellow { background-color: var(--color-yellow); }
        .color-btn.green { background-color: var(--color-green); }
        .color-btn.blue { background-color: var(--color-blue); }
        .color-btn.pink { background-color: var(--color-pink); }
        .color-btn.purple { background-color: var(--color-purple); }
        .color-btn.clear { background-color: var(--card-bg); display: flex; align-items: center; justify-content: center; font-size: 0.7rem; }

        /* Peer & Matching Digit Highlights */
        .cell.highlight-peer {
            background-color: rgba(255, 255, 255, 0.04);
        }
        [data-theme="light"] .cell.highlight-peer {
            background-color: rgba(0, 0, 0, 0.035);
        }

        .cell.matching-digit {
            background-color: rgba(59, 130, 246, 0.32) !important;
            box-shadow: inset 0 0 0 1.5px rgba(96, 165, 250, 0.7);
        }
        [data-theme="light"] .cell.matching-digit {
            background-color: #dbeafe !important;
            box-shadow: inset 0 0 0 1.5px #3b82f6;
        }

        .cell.matching-digit .cell-val {
            color: #60a5fa !important;
            font-weight: 800;
            text-shadow: 0 0 8px rgba(96, 165, 250, 0.5);
        }
        [data-theme="light"] .cell.matching-digit .cell-val {
            color: #1d4ed8 !important;
            text-shadow: none;
        }

        .corner-note-cell.highlight-note {
            color: #fbbf24 !important;
            font-weight: 800 !important;
            text-shadow: 0 0 6px rgba(251, 191, 36, 0.7);
        }
        [data-theme="light"] .corner-note-cell.highlight-note {
            color: #b45309 !important;
            font-weight: 800 !important;
            text-shadow: none;
        }

        #sound-btn.muted {
            opacity: 0.55;
            filter: grayscale(1);
        }

        /* Action Toolbar (Undo, Redo, Multi, Hint, Notes) */
        .action-toolbar {
            display: flex;
            gap: 6px;
            width: 100%;
            justify-content: space-between;
        }

        .action-btn {
            flex: 1;
            min-width: 0;
            padding: 7px 4px;
            font-size: 0.78rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            border-radius: 6px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.15s ease;
            white-space: nowrap;
        }

        @keyframes hintPulseAnim {
            0% { transform: scale(1); box-shadow: 0 0 0 rgba(234, 179, 8, 0); }
            50% { transform: scale(1.08); box-shadow: 0 0 16px rgba(234, 179, 8, 0.9); z-index: 10; }
            100% { transform: scale(1); box-shadow: 0 0 0 rgba(234, 179, 8, 0); }
        }
        .cell.hint-pulse {
            animation: hintPulseAnim 1.1s ease-out;
            background-color: rgba(234, 179, 8, 0.28) !important;
        }

        .action-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            pointer-events: none;
        }

        .action-btn:not(:disabled):hover {
            background: var(--border-color);
            transform: translateY(-1px);
        }

        .action-btn:not(:disabled):active {
            transform: translateY(0);
        }

        .mini-icon-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 0 2px;
            font-size: 0.75rem;
            color: var(--subtext-color);
            line-height: 1;
            vertical-align: middle;
        }

        .mini-icon-btn:hover {
            color: var(--text-color);
        }

        /* Pause Overlay */
        .board-wrapper {
            position: relative;
        }

        .pause-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            z-index: 20;
            color: #f8fafc;

    <script>
        let board = Array(81).fill(0);

        let soundEnabled = localStorage.getItem('sudoku-sound') !== 'false';
        let audioCtx = null;

        function getAudioContext() {
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (AudioContextClass) audioCtx = new AudioContextClass();
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume().catch(() => {});
            }
            return audioCtx;
        }

        // Unlock Web Audio on first user interaction
        window.addEventListener('pointerdown', () => {
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume().catch(() => {});
            }
        }, { passive: true });

        function playTone(freq, type = 'sine', duration = 0.08, gainVal = 0.08) {
            if (!soundEnabled) return;
            try {
                const ctx = getAudioContext();
                if (!ctx) return;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, ctx.currentTime);
                gain.gain.setValueAtTime(gainVal, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + duration);
            } catch(e) {}
        }

        function playTapSound() {
            playTone(440, 'sine', 0.06, 0.08);
            if (navigator.vibrate) navigator.vibrate(12);
        }

        function playErrorSound() {
            playTone(220, 'sawtooth', 0.15, 0.12);
            if (navigator.vibrate) navigator.vibrate([30, 40, 30]);
        }

        function playWinFanfare() {
            if (!soundEnabled) return;
            const ctx = getAudioContext();
            if (!ctx) return;
            const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
            notes.forEach((freq, i) => {
                setTimeout(() => playTone(freq, 'triangle', 0.25, 0.15), i * 120);
            });
            if (navigator.vibrate) navigator.vibrate([100, 50, 100, 50, 200]);
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            localStorage.setItem('sudoku-sound', soundEnabled ? 'true' : 'false');
            updateSoundBtn();

            const ctx = getAudioContext();
            if (ctx && ctx.state === 'suspended') {
                ctx.resume();
            }

            if (soundEnabled) {
                playTone(587.33, 'triangle', 0.12, 0.12);
                if (navigator.vibrate) navigator.vibrate([25, 30, 25]);
            }
        }

        function updateSoundBtn() {
            const btn = document.getElementById('sound-btn');
            if (btn) {
                btn.innerText = soundEnabled ? '🔊' : '🔇';
                btn.title = soundEnabled ? 'Sound & Haptics: ON (Click to mute)' : 'Sound & Haptics: MUTED (Click to unmute)';
                btn.classList.toggle('muted', !soundEnabled);
            }
        }

        // Timer Functions
        function formatTime(totalSec) {
            const m = Math.floor(totalSec / 60);
            const s = totalSec % 60;
            return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (!isPaused && !gameFinished) {
                    timerSeconds++;
                    const el = document.getElementById('timer-label');
                    if (el) el.innerText = formatTime(timerSeconds);
                }
            }, 1000);
        }

        function resetTimer() {
            clearInterval(timerInterval);
            timerSeconds = 0;
            gameFinished = false;
            isPaused = false;
            const el = document.getElementById('timer-label');
            if (el) el.innerText = '00:00';
            const pauseOverlay = document.getElementById('pause-overlay');
            if (pauseOverlay) pauseOverlay.style.display = 'none';
            const pauseBtn = document.getElementById('pause-btn');
            if (pauseBtn) pauseBtn.innerText = '⏸';
            startTimer();
            updateBestTimeDisplay();
        }

        function togglePause() {
            if (gameFinished) return;
            isPaused = !isPaused;
            const pauseOverlay = document.getElementById('pause-overlay');
            const pauseBtn = document.getElementById('pause-btn');
            if (pauseOverlay) pauseOverlay.style.display = isPaused ? 'flex' : 'none';
            if (pauseBtn) pauseBtn.innerText = isPaused ? '▶' : '⏸';
        }

        function updateBestTimeDisplay() {
            const best = localStorage.getItem('sudoku-best-' + currentDifficulty);
            const el = document.getElementById('best-time-label');
            if (el) el.innerText = best ? formatTime(parseInt(best)) : '--:--';
        }

        // Undo / Redo Functions
        function pushUndoState() {
            undoStack.push({
                board: [...board],
                snyder: snyderNotes.map(s => new Set(s)),
                middle: middleNotes.map(m => new Set(m)),
                colors: [...colors],
                selected: selectedCell
            });
            if (undoStack.length > 50) undoStack.shift();
            redoStack = [];
            updateUndoRedoBtns();
        }

        function undo() {
            if (undoStack.length === 0) return;
            redoStack.push({
                board: [...board],
                snyder: snyderNotes.map(s => new Set(s)),
                middle: middleNotes.map(m => new Set(m)),
                colors: [...colors],
                selected: selectedCell
            });
            const prev = undoStack.pop();
            board = [...prev.board];
            snyderNotes = prev.snyder.map(s => new Set(s));
            middleNotes = prev.middle.map(m => new Set(m));
            colors = [...prev.colors];
            selectedCell = prev.selected;
            updateUndoRedoBtns();
            updateBoardDOM();
            updateKeypadCounts();
            playTapSound();
        }

        function redo() {
            if (redoStack.length === 0) return;
            undoStack.push({
                board: [...board],
                snyder: snyderNotes.map(s => new Set(s)),
                middle: middleNotes.map(m => new Set(m)),
                colors: [...colors],
                selected: selectedCell
            });
            const next = redoStack.pop();
            board = [...next.board];
            snyderNotes = next.snyder.map(s => new Set(s));
            middleNotes = next.middle.map(m => new Set(m));
            colors = [...next.colors];
            selectedCell = next.selected;
            updateUndoRedoBtns();
            updateBoardDOM();
            updateKeypadCounts();
            playTapSound();
        }

        function updateUndoRedoBtns() {
            const uBtn = document.getElementById('undo-btn');
            const rBtn = document.getElementById('redo-btn');
            if (uBtn) uBtn.disabled = undoStack.length === 0;
            if (rBtn) rBtn.disabled = redoStack.length === 0;
        }

        function getAvailableCandidates(grid, cellIndex) {
            const r = Math.floor(cellIndex / 9);
            const c = cellIndex % 9;
            const br = Math.floor(r / 3) * 3;
            const bc = Math.floor(c / 3) * 3;

            const used = new Set();
            for (let j = 0; j < 9; j++) {
                used.add(grid[r * 9 + j]);
                used.add(grid[j * 9 + c]);
                used.add(grid[(br + Math.floor(j / 3)) * 9 + bc + (j % 3)]);
            }

            const candidates = [];
            for (let num = 1; num <= 9; num++) {
                if (!used.has(num)) candidates.push(num);
            }
            return candidates;
        }

        // Automatic Candidate Note Pruning: removes digit from peers in row, col, and 3x3 block
        function removeCandidateFromPeers(cellIndex, val) {
            const row = Math.floor(cellIndex / 9);
            const col = cellIndex % 9;
            const startRow = Math.floor(row / 3) * 3;
            const startCol = Math.floor(col / 3) * 3;

            for (let i = 0; i < 9; i++) {
                const rIdx = row * 9 + i;
                if (rIdx !== cellIndex) {
                    snyderNotes[rIdx].delete(val);
                    middleNotes[rIdx].delete(val);
                }
                const cIdx = i * 9 + col;
                if (cIdx !== cellIndex) {
                    snyderNotes[cIdx].delete(val);
                    middleNotes[cIdx].delete(val);
                }
            }

            for (let r = 0; r < 3; r++) {
                for (let c = 0; c < 3; c++) {
                    const bIdx = (startRow + r) * 9 + (startCol + c);
                    if (bIdx !== cellIndex) {
                        snyderNotes[bIdx].delete(val);
                        middleNotes[bIdx].delete(val);
                    }
                }
            }
        }

        // Option 5: Auto-Fill Candidate Notes
        function fillCandidateNotes() {
            pushUndoState();
            let filledCount = 0;
            for (let i = 0; i < 81; i++) {
                if (board[i] === 0) {
                    const candidates = getAvailableCandidates(board, i);
                    candidates.forEach(num => {
                        if (noteStyle === 'snyder') {
                            snyderNotes[i].add(num);
                        } else {
                            middleNotes[i].add(num);
                        }
                        filledCount++;
                    });
                }
            }
            updateBoardDOM();
            playTapSound();
        }

        // Dedicated Hint System
        function giveHint() {
            if (isPaused || gameFinished) return;

            let targetIdx = -1;
            // 1. If user selected an empty or incorrect cell, hint that specific cell
            if (selectedCell !== null && !given[selectedCell] && board[selectedCell] !== solution[selectedCell]) {
                targetIdx = selectedCell;
            } else {
                // 2. Look for any existing erroneous entries to help player fix them
                for (let i = 0; i < 81; i++) {
                    if (!given[i] && board[i] !== 0 && board[i] !== solution[i]) {
                        targetIdx = i;
                        break;
                    }
                }
                // 3. Otherwise find the easiest empty cell (fewest candidate possibilities)
                if (targetIdx === -1) {
                    let minCands = 10;
                    for (let i = 0; i < 81; i++) {
                        if (!given[i] && board[i] === 0) {
                            const cands = getAvailableCandidates(board, i);
                            if (cands.length < minCands) {
                                minCands = cands.length;
                                targetIdx = i;
                                if (minCands === 1) break; // Naked single found
                            }
                        }
                    }
                }
            }

            if (targetIdx === -1) return; // All cells already filled correctly

            pushUndoState();
            const correctVal = solution[targetIdx];
            board[targetIdx] = correctVal;
            snyderNotes[targetIdx].clear();
            middleNotes[targetIdx].clear();

            selectedCells.clear();
            selectedCells.add(targetIdx);
            selectedCell = targetIdx;

            // Automatically prune this correct digit from peer notes in row, column, and 3x3 block
            removeCandidateFromPeers(targetIdx, correctVal);

            updateBoardDOM();
            updateKeypadCounts();

            // Trigger animated highlight pulse on the hinted cell
            const cellEl = document.querySelector(`.cell[data-index="${targetIdx}"]`);
            if (cellEl) {
                cellEl.classList.add('hint-pulse');
                setTimeout(() => cellEl.classList.remove('hint-pulse'), 1200);
            }

            // Upbeat two-tone hint chime
            playTone(523.25, 'sine', 0.1, 0.12);
            setTimeout(() => playTone(659.25, 'sine', 0.15, 0.12), 110);
            if (navigator.vibrate) navigator.vibrate([30, 40, 30]);

            checkVictory();
        }

        function solveSudoku(grid) {
            const s = [...grid];
            function isValid(idx, num) {
                const r = Math.floor(idx / 9);
                const c = idx % 9;
                const br = Math.floor(r / 3) * 3;
                const bc = Math.floor(c / 3) * 3;
                for (let i = 0; i < 9; i++) {
                    if (s[r * 9 + i] === num) return false;
                    if (s[i * 9 + c] === num) return false;
                    const bi = br + Math.floor(i / 3);
                    const bj = bc + (i % 3);
                    if (s[bi * 9 + bj] === num) return false;
                }
                return true;
            }
            function solve(idx = 0) {
                if (idx === 81) return true;
                if (s[idx] !== 0) return solve(idx + 1);
                for (let num = 1; num <= 9; num++) {
                    if (isValid(idx, num)) {
                        s[idx] = num;
                        if (solve(idx + 1)) return true;
                        s[idx] = 0;
                    }
                }
                return false;
            }
            solve();
            return s;
        }

        function createBoardDOM() {
            const boardEl = document.getElementById('sudoku-board');
            boardEl.innerHTML = '';

            // Global pointer up to finish drag
            window.addEventListener('pointerup', () => {
                isPointerDragging = false;
            });
            window.addEventListener('pointercancel', () => {
                isPointerDragging = false;
            });

            for (let i = 0; i < 81; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.dataset.index = i;
                
                const row = Math.floor(i / 9);
                const col = i % 9;
                const block = Math.floor(row / 3) * 3 + Math.floor(col / 3);

                if (block % 2 === 0) cell.classList.add('block-alt');
                if (col === 2 || col === 5) cell.classList.add('border-right-thick');
                else if (col === 8) cell.classList.add('border-right-none');

                if (row === 2 || row === 5) cell.classList.add('border-bottom-thick');
                else if (row === 8) cell.classList.add('border-bottom-none');

                // Pointer events for instant tap & smooth multi-drag selection
                cell.addEventListener('pointerdown', (e) => {
                    if (isPaused || gameFinished) return;
                    e.preventDefault();

                    // If sticky number is active, apply immediately on tap
                    if (stickyNumber !== null) {
                        if (!given[i]) {
                            selectedCells.clear();
                            selectedCells.add(i);
                            selectedCell = i;
                            handleKeyInput(stickyNumber);
                        }
                        return;
                    }

                    isPointerDragging = true;
                    if (e.ctrlKey || e.metaKey || isMultiSelectMode) {
                        if (selectedCells.has(i)) {
                            selectedCells.delete(i);
                            selectedCell = selectedCells.size > 0 ? Array.from(selectedCells)[selectedCells.size - 1] : null;
                        } else {
                            selectedCells.add(i);
                            selectedCell = i;
                        }
                    } else {
                        selectedCells.clear();
                        selectedCells.add(i);
                        selectedCell = i;
                    }
                    updateBoardDOM();
                });

                cell.addEventListener('pointerenter', (e) => {
                    if (isPointerDragging && stickyNumber === null) {
                        selectedCells.add(i);
                        selectedCell = i;
                        updateBoardDOM();
                    }
                });
                
                // Corner / Snyder Notes Grid (3x3)
                const cornerGrid = document.createElement('div');
                cornerGrid.className = 'corner-notes-grid';
                for (let n = 1; n <= 9; n++) {
                    const noteCell = document.createElement('div');
                    noteCell.className = 'corner-note-cell';
                    noteCell.dataset.note = n;
                    cornerGrid.appendChild(noteCell);
                }
                cell.appendChild(cornerGrid);

                // Center / Middle Notes Cluster
                const centerNotes = document.createElement('div');
                centerNotes.className = 'center-notes';
                cell.appendChild(centerNotes);

                boardEl.appendChild(cell);
            }
        }

        let puzzleCounters = { easy: 0, medium: 0, hard: 0, expert: 0 };
        const clueTargets = { easy: 36, medium: 30, hard: 26, expert: 23 };

        function countSolutions(grid, limit = 2) {
            let count = 0;
            function solve() {
                if (count >= limit) return;
                let minCandidates = 10;
                let bestIdx = -1;
                let bestNums = [];
                for (let idx = 0; idx < 81; idx++) {
                    if (grid[idx] === 0) {
                        const r = Math.floor(idx / 9);
                        const c = idx % 9;
                        const br = Math.floor(r / 3) * 3;
                        const bc = Math.floor(c / 3) * 3;
                        const used = new Set();
                        for (let i = 0; i < 9; i++) {
                            used.add(grid[r * 9 + i]);
                            used.add(grid[i * 9 + c]);
                            used.add(grid[(br + Math.floor(i / 3)) * 9 + bc + (i % 3)]);
                        }
                        const avail = [];
                        for (let num = 1; num <= 9; num++) {
                            if (!used.has(num)) avail.push(num);
                        }
                        if (avail.length < minCandidates) {
                            minCandidates = avail.length;
                            bestIdx = idx;
                            bestNums = avail;
                            if (minCandidates <= 1) break;
                        }
                    }
                }
                if (bestIdx === -1) {
                    count++;
                    return;
                }
                if (bestNums.length === 0) return;
                for (const num of bestNums) {
                    grid[bestIdx] = num;
                    solve();
                    grid[bestIdx] = 0;
                    if (count >= limit) return;
                }
            }
            solve();
            return count;
        }

        function generateFullGrid() {
            const grid = new Array(81).fill(0);
            for (let box = 0; box < 3; box++) {
                const nums = [1,2,3,4,5,6,7,8,9].sort(() => Math.random() - 0.5);
                const startR = box * 3;
                const startC = box * 3;
                let idx = 0;
                for (let r = 0; r < 3; r++) {
                    for (let c = 0; c < 3; c++) {
                        grid[(startR + r) * 9 + (startC + c)] = nums[idx++];
                    }
                }
            }
            function fillRemaining(idx = 0) {
                if (idx === 81) return true;
                if (grid[idx] !== 0) return fillRemaining(idx + 1);
                const r = Math.floor(idx / 9);
                const c = idx % 9;
                const br = Math.floor(r / 3) * 3;
                const bc = Math.floor(c / 3) * 3;
                const used = new Set();
                for (let i = 0; i < 9; i++) {
                    used.add(grid[r * 9 + i]);
                    used.add(grid[i * 9 + c]);
                    used.add(grid[(br + Math.floor(i / 3)) * 9 + bc + (i % 3)]);
                }
                const nums = [];
                for (let num = 1; num <= 9; num++) {
                    if (!used.has(num)) nums.push(num);
                }
                nums.sort(() => Math.random() - 0.5);
                for (const num of nums) {
                    grid[idx] = num;
                    if (fillRemaining(idx + 1)) return true;
                    grid[idx] = 0;
                }
                return false;
            }
            fillRemaining();
            return grid;
        }

        function generateLivePuzzle(targetClues) {
            const grid = generateFullGrid();
            const positions = Array.from({length: 81}, (_, i) => i).sort(() => Math.random() - 0.5);
            let clues = 81;
            for (const pos of positions) {
                if (clues <= targetClues) break;
                const val = grid[pos];
                grid[pos] = 0;
                if (countSolutions([...grid], 2) === 1) {
                    clues--;
                } else {
                    grid[pos] = val;
                }
            }
            return { puzzle: grid.join(''), clues };
        }

        // Lightweight Canvas Confetti Engine (zero external dependencies)
        let confettiAnimation = null;
        function fireConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const particles = [];
            const colors = ['#f59e0b', '#ef4444', '#3b82f6', '#10b981', '#8b5cf6', '#ec4899', '#06b6d4'];
            for (let i = 0; i < 140; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2 + 50,
                    vx: (Math.random() - 0.5) * 18,
                    vy: (Math.random() - 1.2) * 16 - 3,
                    size: Math.random() * 8 + 4,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    rot: Math.random() * 360,
                    vRot: (Math.random() - 0.5) * 10,
                    alpha: 1
                });
            }

            let start = Date.now();
            if (confettiAnimation) cancelAnimationFrame(confettiAnimation);

            function render() {
                const elapsed = Date.now() - start;
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.45; // gravity
                    p.vx *= 0.98; // friction
                    p.rot += p.vRot;
                    if (elapsed > 1800) {
                        p.alpha = Math.max(0, p.alpha - 0.02);
                    }

                    ctx.save();
                    ctx.globalAlpha = p.alpha;
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.rot * Math.PI / 180);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
                    ctx.restore();
                });

                if (elapsed < 3500) {
                    confettiAnimation = requestAnimationFrame(render);
                } else {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
            }
            confettiAnimation = requestAnimationFrame(render);
        }



        function restartGame() {
            board = [...initialBoard];
            snyderNotes = Array(81).fill().map(() => new Set());
            middleNotes = Array(81).fill().map(() => new Set());
            colors = Array(81).fill(null);
            selectedCell = null;
            selectedCells.clear();
            stickyNumber = null;
            updateStickyUI();
            updateBoardDOM();
            updateKeypadCounts();
        }

        function selectCellIndex(index) {
            selectedCell = index;
            updateBoardDOM();
        }

        function setInputMode(mode) {
            inputMode = mode;
            document.getElementById('btn-mode-number').classList.toggle('active', mode === 'number');
            document.getElementById('btn-mode-note').classList.toggle('active', mode === 'note');
            document.getElementById('mode-color-btn').classList.remove('active');
            updateIndicatorLabel();
        }

        function setNoteStyle(style) {
            noteStyle = style;
            setInputMode('note');
            document.getElementById('pill-snyder').classList.toggle('active', style === 'snyder');
            document.getElementById('pill-middle').classList.toggle('active', style === 'middle');
            updateIndicatorLabel();
        }

        function toggleMode(mode) {
            if (mode === 'color') {
                inputMode = (inputMode === 'color') ? 'number' : 'color';
                document.getElementById('mode-color-btn').classList.toggle('active', inputMode === 'color');
                if (inputMode === 'number') {
                    setInputMode('number');
                }
                updateIndicatorLabel();
            }
        }

        function selectColor(color) {
            activeColor = color;
            inputMode = 'color';
            document.getElementById('mode-color-btn').classList.add('active');
            document.getElementById('btn-mode-number').classList.remove('active');
            document.getElementById('btn-mode-note').classList.remove('active');
            
            if (selectedCell !== null) {
                colors[selectedCell] = color;
                updateBoardDOM();
            }
            updateIndicatorLabel();
        }

        function updateIndicatorLabel() {
            let label = 'Normal (Numbers)';
            if (inputMode === 'note') {
                label = noteStyle === 'snyder' ? 'Pencil Notes: Snyder (Corner)' : 'Pencil Notes: Middle (Center)';
            } else if (inputMode === 'color') {
                label = 'Color Highlighting';
            }
            document.getElementById('current-mode-label').innerText = label;
            document.getElementById('current-color-label').innerText = activeColor ? activeColor.toUpperCase() : 'None';
        }

        function getErrorCells() {
            const errorSet = new Set();
            
            for (let i = 0; i < 81; i++) {
                const val = board[i];
                if (val === 0) continue;

                const r = Math.floor(i / 9);
                const c = i % 9;
                const br = Math.floor(r / 3) * 3;
                const bc = Math.floor(c / 3) * 3;

                // Check conflict with any other cell in the same row, column, or 3x3 block
                for (let j = 0; j < 81; j++) {
                    if (i === j || board[j] !== val) continue;
                    const r2 = Math.floor(j / 9);
                    const c2 = j % 9;
                    const br2 = Math.floor(r2 / 3) * 3;
                    const bc2 = Math.floor(c2 / 3) * 3;

                    if (r === r2 || c === c2 || (br === br2 && bc === bc2)) {
                        if (!given[i]) errorSet.add(i);
                        if (!given[j]) errorSet.add(j);
                    }
                }

                // Check if user entry contradicts the true solution
                if (!given[i] && solution.length === 81 && solution[i] !== 0 && val !== solution[i]) {
                    errorSet.add(i);
                }
            }

            return errorSet;
        }

        function getTargetCells() {
            if (selectedCells.size > 0) {
                return Array.from(selectedCells).filter(idx => !given[idx]);
            }
            if (selectedCell !== null && !given[selectedCell]) {
                return [selectedCell];
            }
            return [];
        }

        function handleKeyInput(num) {
            if (isPaused || gameFinished) return;
            const targets = getTargetCells();
            if (targets.length === 0) return;

            pushUndoState();

            if (inputMode === 'number') {
                const singleTarget = targets.length === 1;
                targets.forEach(idx => {
                    const newVal = (singleTarget && board[idx] === num) ? 0 : num;
                    board[idx] = newVal;
                    snyderNotes[idx].clear();
                    middleNotes[idx].clear();

                    // If user placed the right number, automatically prune from pencil notes in block, row, and column
                    if (newVal > 0 && newVal === solution[idx]) {
                        removeCandidateFromPeers(idx, newVal);
                    }
                });

                const errs = getErrorCells();
                const hasAnyError = targets.some(idx => errs.has(idx));
                if (hasAnyError) playErrorSound();
                else playTapSound();
            } else if (inputMode === 'note') {
                targets.forEach(idx => {
                    if (board[idx] === 0) {
                        if (noteStyle === 'snyder') {
                            if (snyderNotes[idx].has(num)) snyderNotes[idx].delete(num);
                            else snyderNotes[idx].add(num);
                        } else {
                            if (middleNotes[idx].has(num)) middleNotes[idx].delete(num);
                            else middleNotes[idx].add(num);
                        }
                    }
                });
                playTapSound();
            }

            updateBoardDOM();
            updateKeypadCounts();
            checkVictory();
        }

        function clearSelection() {
            if (isPaused || gameFinished) return;
            const targets = getTargetCells();
            if (targets.length === 0) return;

            pushUndoState();

            if (inputMode === 'color') {
                targets.forEach(idx => colors[idx] = null);
            } else {
                targets.forEach(idx => {
                    if (board[idx] !== 0) {
                        board[idx] = 0;
                    } else {
                        snyderNotes[idx].clear();
                        middleNotes[idx].clear();
                    }
                });
            }
            playTapSound();
            updateBoardDOM();
            updateKeypadCounts();
        }

        function selectColor(color) {
            activeColor = color;
            inputMode = 'color';
            document.getElementById('mode-color-btn').classList.add('active');
            document.getElementById('btn-mode-number').classList.remove('active');
            document.getElementById('btn-mode-note').classList.remove('active');
            
            const targets = getTargetCells();
            if (targets.length > 0) {
                pushUndoState();
                targets.forEach(idx => colors[idx] = color);
                updateBoardDOM();
            }
            updateIndicatorLabel();
        }

        function updateBoardDOM() {
            const cells = document.querySelectorAll('.cell');
            const errorCells = getErrorCells();

            // Digit Focus values
            const activeVal = (selectedCell !== null && board[selectedCell] !== 0) ? board[selectedCell] : null;
            const selRow = (selectedCell !== null) ? Math.floor(selectedCell / 9) : null;
            const selCol = (selectedCell !== null) ? (selectedCell % 9) : null;
            const selBox = (selectedCell !== null) ? Math.floor(selRow / 3) * 3 + Math.floor(selCol / 3) : null;

            cells.forEach((cell, i) => {
                const row = Math.floor(i / 9);
                const col = i % 9;
                const block = Math.floor(row / 3) * 3 + Math.floor(col / 3);

                cell.className = 'cell';
                if (block % 2 === 0) cell.classList.add('block-alt');
                if (col === 2 || col === 5) cell.classList.add('border-right-thick');
                else if (col === 8) cell.classList.add('border-right-none');

                if (row === 2 || row === 5) cell.classList.add('border-bottom-thick');
                else if (row === 8) cell.classList.add('border-bottom-none');

                if (given[i]) cell.classList.add('given');
                else if (board[i] !== 0) cell.classList.add('user-input');
                
                if (selectedCells.has(i)) cell.classList.add('selected');
                if (i === selectedCell && selectedCells.size > 1) cell.classList.add('primary-selected');

                // Peer Crosshair Highlight (same row, col, or box)
                if (selectedCell !== null && i !== selectedCell && (row === selRow || col === selCol || block === selBox)) {
                    cell.classList.add('highlight-peer');
                }

                // Digit Focus (All matching numbers glow)
                if (activeVal !== null && board[i] === activeVal) {
                    cell.classList.add('matching-digit');
                }

                // Error Highlight in Red
                if (errorCells.has(i)) {
                    cell.classList.add('error');
                }

                if (colors[i]) {
                    cell.style.backgroundColor = colorHexMap[colors[i]];
                    cell.style.color = '#0f172a';
                } else {
                    cell.style.backgroundColor = '';
                    cell.style.color = '';
                }

                // Render Main Value
                let valueSpan = cell.querySelector('.cell-val');
                if (!valueSpan) {
                    valueSpan = document.createElement('span');
                    valueSpan.className = 'cell-val';
                    cell.appendChild(valueSpan);
                }
                valueSpan.innerText = board[i] !== 0 ? board[i] : '';

                // Render Snyder (Corner/Edge) Notes
                const cornerGrid = cell.querySelector('.corner-notes-grid');
                if (cornerGrid) {
                    const noteCells = cornerGrid.querySelectorAll('.corner-note-cell');
                    noteCells.forEach(nc => {
                        const n = parseInt(nc.dataset.note);
                        const hasNote = (board[i] === 0 && snyderNotes[i].has(n));
                        nc.innerText = hasNote ? n : '';
                        nc.classList.toggle('highlight-note', hasNote && activeVal !== null && n === activeVal);
                    });
                }

                // Render Middle (Center) Notes
                const centerEl = cell.querySelector('.center-notes');
                if (centerEl) {
                    if (board[i] === 0 && middleNotes[i].size > 0) {
                        const sortedNotes = Array.from(middleNotes[i]).sort((a, b) => a - b);
                        centerEl.innerText = sortedNotes.join(' ');
                    } else {
                        centerEl.innerText = '';
                    }
                }
            });

            // Update error indicator in status bar
            const errorStatusEl = document.getElementById('error-status');
            if (errorStatusEl) {
                if (errorCells.size > 0) {
                    errorStatusEl.style.display = 'inline-flex';
                    errorStatusEl.innerText = `⚠️ ${errorCells.size} Error${errorCells.size > 1 ? 's' : ''}`;
                } else {
                    errorStatusEl.style.display = 'none';
                }
            }
        }

        function updateKeypadCounts() {
            let counts = Array(10).fill(9);
            board.forEach(val => {
                if (val >= 1 && val <= 9) counts[val]--;
            });

            for (let i = 1; i <= 9; i++) {
                const countEl = document.getElementById(`count-${i}`);
                if (countEl) {
                    countEl.innerText = counts[i];
                    countEl.style.opacity = counts[i] === 0 ? '0.3' : '1';
                }
            }
        }

        // Physical keyboard support
        window.addEventListener('keydown', (e) => {
            // Undo / Redo shortcuts
            if ((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'Z')) {
                if (e.shiftKey) redo();
                else undo();
                e.preventDefault();
                return;
            } else if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || e.key === 'Y')) {
                redo();
                e.preventDefault();
                return;
            }

            if (e.key >= '1' && e.key <= '9') {
                handleKeyInput(parseInt(e.key));
            } else if (e.key === 'Backspace' || e.key === 'Delete') {
                clearSelection();
            } else if (e.key === 'n' || e.key === 'N') {
                setInputMode(inputMode === 'number' ? 'note' : 'number');
            } else if (e.key === 's' || e.key === 'S') {
                setNoteStyle('snyder');
            } else if (e.key === 'm' || e.key === 'M') {
                setNoteStyle('middle');
            } else if (e.key === 'p' || e.key === 'P') {
                togglePause();
            } else if (selectedCell !== null) {
                const row = Math.floor(selectedCell / 9);
                const col = selectedCell % 9;
                if (e.key === 'ArrowUp' && row > 0) {
                    selectCellIndex(selectedCell - 9);
                } else if (e.key === 'ArrowDown' && row < 8) {
                    selectCellIndex(selectedCell + 9);
                } else if (e.key === 'ArrowLeft' && col > 0) {
                    selectCellIndex(selectedCell - 1);
                } else if (e.key === 'ArrowRight' && col < 8) {
                    selectCellIndex(selectedCell + 1);
                }
            }
        });

        window.onload = initGame;
    </script>
    <!-- Victory Celebration Modal -->
    <div id="victory-modal" class="modal-backdrop" style="display:none;">
        <div class="modal-card">
            <h2>🎉 Puzzle Solved!</h2>
            <p>Congratulations, you completed the grid!</p>
            <div class="modal-stats">
                <div>Difficulty: <strong id="victory-diff">Medium</strong></div>
                <div>Time: <strong id="victory-time">00:00</strong></div>
                <div id="victory-record" style="color:#10b981; font-weight:700; display:none;">🏆 New Personal Best!</div>
            </div>
            <div class="modal-actions">
                <button class="modal-btn secondary" onclick="closeVictoryModal()">Close</button>
                <button class="modal-btn primary" onclick="closeVictoryModal(); generateNewUnlimited();">Next Puzzle</button>
            </div>
        </div>
    </div>

    <!-- Celebration Confetti Canvas -->
    <canvas id="confetti-canvas"></canvas>

</body>
